nav:
  - About DePSI: index.md
  - Install DePSI: installation.md
  - Usage:
    - DePSI Workflow: usages/depsi_workflow.md
    - Starting with a coregistered stack: usages/start_depsi.md
    - PS selection: usages/ps_selection.md
    - Network estimation: usages/network.md
    - Atmospheric phase screen estimation: usages/aps_estimation.md
    - Densification: usages/densification.md
    - Geo-coding: usages/geocoding.md
    - Post-processing: usages/postprocessing.md
    - DS selection: usages/ds_tutorial.md
    - Designate-targets selection: usages/dtd_selection.md
  - API Reference:
    - depsi.classification: api/classification.md
    - depsi.arc_estimation: api/arc_estimation.md
    - depsi.network: api/network.md
    - depsi.atmosphere_estimation: api/atmosphere_estimation.md
    - depsi.densification: api/densification.md
    - depsi.transformations: api/transformations.md
    - depsi.io: api/io.md
