site_name: "DePSI: Delft PS-InSAR processing package"
repo_url: https://github.com/TUDelftGeodesy/DePSI
repo_name: DePSI

nav:
  - Get started: 
    - About DePSI: get_started/about_depsi.md
    - Install DePSI: get_started/installation.md
  - Usage:
    - DePSI Workflow: usages/depsi_workflow.md
    - Starting point - Space-Time Matrix: usages/start_with_stm.md
    - PS selection: usages/ps_selection.md
    - Network estimation: usages/network.md
    - Atmospheric phase screen estimation: usages/aps_estimation.md
    - Densification: usages/densification.md
    - Geo-coding: usages/geocoding.md
    - Post-processing: usages/postprocessing.md
  - API Reference:
    - depsi.io: api/io.md
    - depsi.classification: api/classification.md
  - Contributing: 
    - Contributing guide: CONTRIBUTING.md
    - Practical info for developers: dev_guide.md
    - Code of conduct: CODE_OF_CONDUCT.md
  - Example Notebooks:
    - SARXarray and STMTools Dependencies of DePSI: notebooks/demo_sarxarray_and_stmtools.ipynb
    - DePSI example workflow: notebooks/demo_depsi.ipynb


theme:
  name: material
  custom_dir: docs/notebooks/download_button
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: blue
      accent: white

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: black
      accent: pink
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
  
plugins:
- mkdocs-jupyter:
      include_source: True
- search
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: numpy
          docstring_options:
            ignore_init_summary: no
          merge_init_into_class: yes
          show_submodules: no
- include-markdown

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra:
  generator: false
  version:
    provider: mike