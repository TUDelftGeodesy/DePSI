# Build and test for the private repository for TUDelft Radar group
# Only test on PR for dev branch, not triggered for draft PR

name: Build and pytest

on:
  push:
    branches: [ "dev" ]
  pull_request:
    # This defines types for both draft and regular PR
    # "ready_for_review" is the trigger when converting a draft PR into a regular PR
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "dev" ]

jobs:
  build:
    # This disables all types for draft PR
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --all-groups
    - name: Build the package
      run: uv build
    - name: Test with pytest
      run: uv run pytest
